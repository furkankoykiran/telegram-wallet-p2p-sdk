name: Publish to PyPI and NPM

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install build tool
        run: python -m pip install --upgrade build twine
        
      - name: Build generic wheel and source tarball
        working-directory: packages/python
        run: python -m build
        
      - name: Publish to PyPI
        working-directory: packages/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  npm-publish-node:
    name: Publish Node.js SDK to NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies and build
        working-directory: packages/node
        run: |
          npm ci
          npm run build
          
      - name: Publish Node SDK
        working-directory: packages/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  npm-publish-mcp:
    name: Publish MCP Server to NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies and build
        working-directory: packages/mcp
        run: |
          npm ci
          npm run build
          
      - name: Publish MCP Server
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  npm-publish-node-gpr:
    name: Publish Node.js SDK to GitHub Packages
    needs: npm-publish-node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          
      - name: Install dependencies and build
        working-directory: packages/node
        run: |
          npm ci
          npm run build
          
      - name: Publish Node SDK to GitHub Packages
        working-directory: packages/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public

  npm-publish-mcp-gpr:
    name: Publish MCP Server to GitHub Packages
    needs: npm-publish-mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          
      - name: Install dependencies and build
        working-directory: packages/mcp
        run: |
          npm ci
          npm run build
          
      - name: Publish MCP Server to GitHub Packages
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public
